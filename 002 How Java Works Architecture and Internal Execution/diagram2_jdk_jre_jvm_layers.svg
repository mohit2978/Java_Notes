<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg002_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="drop002_2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg002_2)" rx="16" />

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="700">JDK vs JRE vs JVM Component Architecture</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Nested relationship: JDK ⊃ JRE ⊃ JVM</text>

  <!-- Outer Layer: JDK -->
  <g filter="url(#drop002_2)">
    <rect x="50" y="90" width="800" height="350" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <text x="80" y="125" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">JDK (Java Development Kit) — To Code &amp; Build</text>
    
    <!-- Development Tools Box -->
    <rect x="570" y="150" width="250" height="260" rx="10" fill="#2e1065" stroke="#a855f7" />
    <text x="695" y="180" text-anchor="middle" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Development Tools</text>
    <text x="590" y="215" fill="#e9d5ff" font-family="Courier New, monospace" font-size="12">• javac (Compiler)</text>
    <text x="590" y="245" fill="#e9d5ff" font-family="Courier New, monospace" font-size="12">• jdb (Debugger)</text>
    <text x="590" y="275" fill="#e9d5ff" font-family="Courier New, monospace" font-size="12">• javadoc (Doc Gen)</text>
    <text x="590" y="305" fill="#e9d5ff" font-family="Courier New, monospace" font-size="12">• jar (Archiver)</text>
    <text x="590" y="345" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="11">Needed to write &amp; compile code</text>
  </g>

  <!-- Middle Layer: JRE -->
  <g filter="url(#drop002_2)">
    <rect x="80" y="150" width="460" height="260" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="105" y="180" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">JRE (Java Runtime Environment) — To Run</text>

    <!-- Class Libraries Box -->
    <rect x="100" y="200" width="420" height="40" rx="6" fill="#047857" stroke="#34d399" />
    <text x="310" y="225" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Class Libraries (`java.lang`, `java.util`, `java.math`, `java.io`)</text>
  </g>

  <!-- Inner Layer: JVM -->
  <g filter="url(#drop002_2)">
    <rect x="100" y="255" width="420" height="135" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
    <text x="310" y="285" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">JVM (Java Virtual Machine)</text>
    
    <!-- JVM Internal Blocks -->
    <rect x="120" y="305" width="115" height="65" rx="6" fill="#075985" />
    <text x="177" y="330" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Class Loader</text>
    <text x="177" y="348" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9">Loads `.class`</text>

    <rect x="250" y="305" width="120" height="65" rx="6" fill="#075985" />
    <text x="310" y="330" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Execution Engine</text>
    <text x="310" y="348" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9">Bytecode to M/C</text>

    <rect x="385" y="305" width="115" height="65" rx="6" fill="#075985" />
    <text x="442" y="330" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">JIT &amp; GC</text>
    <text x="442" y="348" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9">Opt + Memory</text>
  </g>
</svg>
