<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bg002_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="drop002_4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg002_4)" rx="16" />

  <!-- Title -->
  <text x="460" y="40" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="700">Anatomy of the Java Entry Point</text>
  <text x="460" y="65" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Detailed Breakdown of `public static void main(String[] args)` &amp; File Naming Rules</text>

  <!-- Method Signature Display -->
  <g filter="url(#drop002_4)">
    <rect x="50" y="90" width="820" height="60" rx="10" fill="#020617" stroke="#334155" stroke-width="1.5" />
    
    <!-- public -->
    <rect x="70" y="100" width="110" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8" />
    <text x="125" y="125" text-anchor="middle" fill="#a5b4fc" font-family="Courier New, monospace" font-size="15" font-weight="700">public</text>

    <!-- static -->
    <rect x="200" y="100" width="110" height="40" rx="6" fill="#0f291e" stroke="#34d399" />
    <text x="255" y="125" text-anchor="middle" fill="#6ee7b7" font-family="Courier New, monospace" font-size="15" font-weight="700">static</text>

    <!-- void -->
    <rect x="330" y="100" width="100" height="40" rx="6" fill="#311928" stroke="#fb7185" />
    <text x="380" y="125" text-anchor="middle" fill="#fda4af" font-family="Courier New, monospace" font-size="15" font-weight="700">void</text>

    <!-- main -->
    <rect x="450" y="100" width="110" height="40" rx="6" fill="#382618" stroke="#f59e0b" />
    <text x="505" y="125" text-anchor="middle" fill="#fde68a" font-family="Courier New, monospace" font-size="15" font-weight="700">main</text>

    <!-- (String[] args) -->
    <rect x="580" y="100" width="270" height="40" rx="6" fill="#0c4a6e" stroke="#38bdf8" />
    <text x="715" y="125" text-anchor="middle" fill="#bae6fd" font-family="Courier New, monospace" font-size="15" font-weight="700">(String[] args)</text>
  </g>

  <!-- Explanations Grid -->
  <g filter="url(#drop002_4)">
    <!-- public card -->
    <rect x="50" y="170" width="150" height="150" rx="8" fill="#1e1b4b" stroke="#4338ca" />
    <text x="125" y="195" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">public</text>
    <text x="60" y="220" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Access modifier:</text>
    <text x="60" y="238" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Allows the JVM to</text>
    <text x="60" y="254" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">call main() from</text>
    <text x="60" y="270" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">outside without</text>
    <text x="60" y="286" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">restriction.</text>

    <!-- static card -->
    <rect x="215" y="170" width="155" height="150" rx="8" fill="#064e3b" stroke="#059669" />
    <text x="292" y="195" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">static</text>
    <text x="225" y="220" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Class-level method:</text>
    <text x="225" y="238" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">JVM calls it directly</text>
    <text x="225" y="254" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">via ClassName.main()</text>
    <text x="225" y="270" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">without creating an</text>
    <text x="225" y="286" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">object instance first.</text>

    <!-- void card -->
    <rect x="385" y="170" width="150" height="150" rx="8" fill="#4c0519" stroke="#be123c" />
    <text x="460" y="195" text-anchor="middle" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">void</text>
    <text x="395" y="220" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Return Type:</text>
    <text x="395" y="238" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">Returns nothing</text>
    <text x="395" y="254" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">to the OS/JVM</text>
    <text x="395" y="270" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">when execution</text>
    <text x="395" y="286" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">completes.</text>

    <!-- main & String[] args card -->
    <rect x="550" y="170" width="320" height="150" rx="8" fill="#075985" stroke="#0284c7" />
    <text x="710" y="195" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">main(String[] args)</text>
    <text x="565" y="220" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• <tspan fill="#fde68a" font-weight="600">main:</tspan> Configured entry-point identifier for JVM.</text>
    <text x="565" y="245" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">• <tspan fill="#bae6fd" font-weight="600">String[] args:</tspan> Array of command-line arguments</text>
    <text x="575" y="263" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="11">passed during runtime launch.</text>
  </g>

  <!-- Bottom: Rule Box -->
  <g filter="url(#drop002_4)">
    <rect x="50" y="340" width="820" height="85" rx="10" fill="#18181b" stroke="#eab308" stroke-width="1.5" />
    <text x="70" y="365" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">⚡ Why Only 1 Public Class Per File? (FileName.java == PublicClassName):</text>
    <text x="70" y="390" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">When compiling with `javac Employee.java`, JVM generates `Employee.class`. Having exactly 1 public class matching the file name allows the compiler &amp; JVM to instantly locate the entry-point class without scanning all classes in the file.</text>
  </g>
</svg>
