<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg002_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="byteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="drop002_1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg002_1)" rx="16" />

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="700">How Java Works: Compilation &amp; WORA Architecture</text>
  <text x="450" y="65" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Write Once, Run Anywhere — Bytecode is Platform Independent, JVM is Platform Dependent</text>

  <!-- Step 1: Source Code -->
  <g filter="url(#drop002_1)">
    <rect x="40" y="100" width="180" height="90" rx="10" fill="url(#srcGrad)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="130" y="135" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Java Source Code</text>
    <text x="130" y="160" text-anchor="middle" fill="#dbeafe" font-family="Courier New, monospace" font-size="13">Student.java</text>
    <text x="130" y="178" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="11">Human Readable</text>
  </g>

  <!-- Arrow with javac -->
  <path d="M 220 145 L 295 145" stroke="#f59e0b" stroke-width="2.5" />
  <polygon points="305,145 293,139 293,151" fill="#f59e0b" />
  <rect x="235" y="115" width="60" height="22" rx="4" fill="#78350f" />
  <text x="265" y="130" text-anchor="middle" fill="#fbbf24" font-family="Courier New, monospace" font-size="11" font-weight="700">javac</text>

  <!-- Step 2: Bytecode -->
  <g filter="url(#drop002_1)">
    <rect x="310" y="100" width="200" height="90" rx="10" fill="url(#byteGrad)" stroke="#34d399" stroke-width="1.5" />
    <text x="410" y="135" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Java Bytecode</text>
    <text x="410" y="160" text-anchor="middle" fill="#d1fae5" font-family="Courier New, monospace" font-size="13">Student.class</text>
    <text x="410" y="178" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="11">Platform Independent ✨</text>
  </g>

  <!-- Branching Arrows to Platform JVMs -->
  <path d="M 510 145 C 570 145, 560 110, 600 110" fill="none" stroke="#a855f7" stroke-width="2" />
  <polygon points="610,110 598,105 598,115" fill="#a855f7" />

  <path d="M 510 145 L 600 145" stroke="#38bdf8" stroke-width="2" />
  <polygon points="610,145 598,140 598,150" fill="#38bdf8" />

  <path d="M 510 145 C 570 145, 560 180, 600 180" fill="none" stroke="#f43f5e" stroke-width="2" />
  <polygon points="610,180 598,175 598,185" fill="#f43f5e" />

  <!-- Platform JVMs and OS -->
  <!-- Windows -->
  <g filter="url(#drop002_1)">
    <rect x="615" y="90" width="245" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8" />
    <text x="737" y="115" text-anchor="middle" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="12">Windows JVM ➔ Native Machine Code</text>
  </g>

  <!-- macOS -->
  <g filter="url(#drop002_1)">
    <rect x="615" y="135" width="245" height="40" rx="6" fill="#0f2b38" stroke="#38bdf8" />
    <text x="737" y="160" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, sans-serif" font-size="12">macOS JVM ➔ Native Machine Code</text>
  </g>

  <!-- Linux -->
  <g filter="url(#drop002_1)">
    <rect x="615" y="180" width="245" height="40" rx="6" fill="#381520" stroke="#fb7185" />
    <text x="737" y="205" text-anchor="middle" fill="#ffe4e6" font-family="Segoe UI, sans-serif" font-size="12">Linux JVM ➔ Native Machine Code</text>
  </g>

  <!-- Bottom Key Takeaway Box -->
  <g filter="url(#drop002_1)">
    <rect x="40" y="240" width="820" height="165" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="65" y="275" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">⭐ Key Takeaways:</text>
    <text x="65" y="305" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">1. <tspan fill="#38bdf8" font-weight="600">Bytecode (.class):</tspan> Highly optimized intermediate representation. Remains 100% identical on all machines.</text>
    <text x="65" y="335" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">2. <tspan fill="#fb7185" font-weight="600">JVM:</tspan> Platform Dependent (written specifically for Windows, Mac, or Linux). Contains the <tspan fill="#f59e0b" font-weight="600">JIT Compiler</tspan>.</text>
    <text x="65" y="365" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">3. <tspan fill="#34d399" font-weight="600">Portability Formula:</tspan> Platform-Independent Bytecode + Platform-Specific JVM = <tspan fill="#fde047" font-weight="700">Write Once, Run Anywhere (WORA)</tspan></text>
  </g>
</svg>
