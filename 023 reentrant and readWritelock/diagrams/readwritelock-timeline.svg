<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="618" height="198" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="20" y="26" font-size="12.5" font-weight="600" fill="#334155">Thread-0 — read lock (shared)</text>
  <rect x="20" y="34" width="220" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="52" text-anchor="middle" font-size="11" fill="#1e3a8a">Read Lock acquired → sleep(8s) → release</text>

  <text x="20" y="88" font-size="12.5" font-weight="600" fill="#334155">Thread-1 — read lock (shared)</text>
  <rect x="20" y="96" width="220" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="130" y="114" text-anchor="middle" font-size="11" fill="#1e3a8a">Read Lock acquired → sleep(8s) → release</text>

  <text x="20" y="150" font-size="12.5" font-weight="600" fill="#334155">Thread-2 — write lock (exclusive)</text>
  <rect x="20" y="158" width="220" height="26" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="130" y="175" text-anchor="middle" font-size="11" fill="#991b1b">waiting for both read locks...</text>
  <rect x="250" y="158" width="180" height="26" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="175" text-anchor="middle" font-size="11" fill="#14532d">Write Lock acquired → release</text>

  <path d="M240 48 V158" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <path d="M240 110 V158" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="530" y="60" text-anchor="middle" font-size="11.5" fill="#334155">Both reads run</text>
  <text x="530" y="76" text-anchor="middle" font-size="11.5" fill="#334155">concurrently</text>
  <text x="530" y="170" text-anchor="middle" font-size="11.5" fill="#334155">Write waits until</text>
  <text x="530" y="186" text-anchor="middle" font-size="11.5" fill="#334155">both reads release</text>
</svg>
