<svg viewBox="0 0 620 170" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="618" height="168" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="20" y="28" font-size="12.5" font-weight="600" fill="#334155">th1 → resource1 (own monitor lock)</text>
  <rect x="20" y="38" width="280" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="58" text-anchor="middle" font-size="11.5" fill="#1e3a8a">Lock acquired → sleep(4000) → Lock released</text>

  <text x="20" y="98" font-size="12.5" font-weight="600" fill="#334155">th2 → resource2 (own monitor lock)</text>
  <rect x="20" y="108" width="280" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="128" text-anchor="middle" font-size="11.5" fill="#14532d">Lock acquired → sleep(4000) → Lock released</text>

  <path d="M20 68 V108" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <path d="M300 68 V108" stroke="#cbd5e1" stroke-dasharray="3 3"/>

  <text x="460" y="55" text-anchor="middle" font-size="12" fill="#334155">Different objects →</text>
  <text x="460" y="72" text-anchor="middle" font-size="12" fill="#334155">different monitor locks</text>
  <text x="460" y="98" text-anchor="middle" font-size="12" fill="#334155">→ both threads run</text>
  <text x="460" y="115" text-anchor="middle" font-size="12" fill="#334155">the critical section</text>
  <text x="460" y="132" text-anchor="middle" font-size="12" fill="#334155">at the same time</text>
</svg>
