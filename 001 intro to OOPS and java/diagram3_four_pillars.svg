<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad3)" rx="16" />

  <!-- Title -->
  <text x="460" y="42" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="700">The 4 Pillars of Object-Oriented Programming</text>
  <text x="460" y="68" text-anchor="middle" fill="#a5b4fc" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Fundamental Principles for Robust, Secure &amp; Scalable Software</text>

  <!-- Pillar 1: Abstraction -->
  <g filter="url(#shadow3)">
    <rect x="30" y="95" width="195" height="355" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <rect x="30" y="95" width="195" height="42" rx="12" fill="#4338ca" />
    <text x="127" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">1. Abstraction</text>
    
    <text x="42" y="160" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">WHAT IT IS:</text>
    <text x="42" y="180" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11">Hiding internal</text>
    <text x="42" y="196" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11">details &amp; showing</text>
    <text x="42" y="212" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11">only essential features.</text>

    <text x="42" y="245" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">HOW (JAVA):</text>
    <text x="42" y="265" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11">• abstract class</text>
    <text x="42" y="283" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="11">• interface (100%)</text>

    <text x="42" y="318" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">ADVANTAGES:</text>
    <text x="42" y="338" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Security &amp; privacy</text>
    <text x="42" y="356" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Reduces complexity</text>
    
    <rect x="40" y="390" width="175" height="45" rx="6" fill="#312e81" />
    <text x="127" y="410" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Example: Car Ignition</text>
    <text x="127" y="425" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="9">Key turn without engine details</text>
  </g>

  <!-- Pillar 2: Encapsulation -->
  <g filter="url(#shadow3)">
    <rect x="250" y="95" width="195" height="355" rx="12" fill="#132e27" stroke="#10b981" stroke-width="1.5" />
    <rect x="250" y="95" width="195" height="42" rx="12" fill="#047857" />
    <text x="347" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">2. Encapsulation</text>
    
    <text x="262" y="160" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">WHAT IT IS:</text>
    <text x="262" y="180" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="11">Bundling data &amp; code</text>
    <text x="262" y="196" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="11">in one unit (Class).</text>
    <text x="262" y="212" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="11">"Data Hiding".</text>

    <text x="262" y="245" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">HOW (JAVA):</text>
    <text x="262" y="265" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="11">• private variables</text>
    <text x="262" y="283" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="11">• public getters/setters</text>

    <text x="262" y="318" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">ADVANTAGES:</text>
    <text x="262" y="338" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Data protection</text>
    <text x="262" y="356" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Loosely coupled code</text>

    <rect x="260" y="390" width="175" height="45" rx="6" fill="#064e3b" />
    <text x="347" y="410" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Example: Bank Account</text>
    <text x="347" y="425" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="9">deposit() / withdraw() validation</text>
  </g>

  <!-- Pillar 3: Inheritance -->
  <g filter="url(#shadow3)">
    <rect x="470" y="95" width="195" height="355" rx="12" fill="#2d1b38" stroke="#a855f7" stroke-width="1.5" />
    <rect x="470" y="95" width="195" height="42" rx="12" fill="#7e22ce" />
    <text x="567" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">3. Inheritance</text>
    
    <text x="482" y="160" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">WHAT IT IS:</text>
    <text x="482" y="180" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="11">Child inherits parent's</text>
    <text x="482" y="196" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="11">fields and methods.</text>
    <text x="482" y="212" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="11">"IS-A Relationship".</text>

    <text x="482" y="245" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">HOW (JAVA):</text>
    <text x="482" y="265" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="11">• extends (class)</text>
    <text x="482" y="283" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="11">• implements (interface)</text>

    <text x="482" y="318" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">ADVANTAGES:</text>
    <text x="482" y="338" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Code Reusability</text>
    <text x="482" y="356" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Enables Polymorphism</text>

    <rect x="480" y="390" width="175" height="45" rx="6" fill="#581c87" />
    <text x="567" y="410" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Example: Animal Hierarchy</text>
    <text x="567" y="425" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="9">Dog IS-A Animal, inherits eat()</text>
  </g>

  <!-- Pillar 4: Polymorphism -->
  <g filter="url(#shadow3)">
    <rect x="690" y="95" width="200" height="355" rx="12" fill="#382618" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="690" y="95" width="200" height="42" rx="12" fill="#b45309" />
    <text x="790" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">4. Polymorphism</text>
    
    <text x="702" y="160" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">WHAT IT IS:</text>
    <text x="702" y="180" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="11">One method behaving</text>
    <text x="702" y="196" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="11">differently in different</text>
    <text x="702" y="212" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="11">contexts ("Many Forms").</text>

    <text x="702" y="245" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">TYPES:</text>
    <text x="702" y="265" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="11">• Compile-time (Overload)</text>
    <text x="702" y="283" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="11">• Runtime (Override @JVM)</text>

    <text x="702" y="318" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">ADVANTAGES:</text>
    <text x="702" y="338" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Dynamic Dispatch</text>
    <text x="702" y="356" fill="#a5f3fc" font-family="Segoe UI, sans-serif" font-size="11">✔ Polymorphic Collections</text>

    <rect x="700" y="390" width="180" height="45" rx="6" fill="#78350f" />
    <text x="790" y="410" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Example: Shape.draw()</text>
    <text x="790" y="425" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="9">Circle/Square custom draw()</text>
  </g>
</svg>
