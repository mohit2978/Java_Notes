<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad6)" rx="16" />

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, -apple-system, sans-serif" font-size="22" font-weight="700">OOP Relationships: IS-A vs HAS-A</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, -apple-system, sans-serif" font-size="13">Inheritance (Generalization) vs Association (Containment / Composition)</text>

  <!-- IS-A Box -->
  <g filter="url(#shadow6)">
    <rect x="40" y="95" width="385" height="315" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="40" y="95" width="385" height="42" rx="12" fill="#3730a3" />
    <text x="232" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">IS-A Relationship (Inheritance)</text>

    <text x="60" y="165" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Meaning:</text>
    <text x="60" y="185" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="12">Child class IS A specialized type of Parent class.</text>

    <text x="60" y="215" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Implementation:</text>
    <rect x="60" y="225" width="345" height="55" rx="6" fill="#0f172a" stroke="#4338ca" />
    <text x="75" y="248" fill="#a5b4fc" font-family="Courier New, monospace" font-size="12">class Bird extends Animal { ... }</text>
    <text x="75" y="268" fill="#a5b4fc" font-family="Courier New, monospace" font-size="12">class B extends A { ... }</text>

    <text x="60" y="305" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Characteristics:</text>
    <text x="60" y="325" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">• Tight coupling via hierarchy</text>
    <text x="60" y="345" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">• Direct code reuse of parent methods/fields</text>

    <rect x="60" y="365" width="345" height="30" rx="4" fill="#312e81" />
    <text x="232" y="385" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Rule: Use "extends" or "implements"</text>
  </g>

  <!-- HAS-A Box -->
  <g filter="url(#shadow6)">
    <rect x="475" y="95" width="385" height="315" rx="12" fill="#142c26" stroke="#34d399" stroke-width="1.5" />
    <rect x="475" y="95" width="385" height="42" rx="12" fill="#065f46" />
    <text x="667" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">HAS-A Relationship (Association)</text>

    <text x="495" y="165" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Meaning:</text>
    <text x="495" y="185" fill="#d1fae5" font-family="Segoe UI, sans-serif" font-size="12">Class contains an instance / reference of another class.</text>

    <text x="495" y="215" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Implementation:</text>
    <rect x="495" y="225" width="345" height="55" rx="6" fill="#0f172a" stroke="#047857" />
    <text x="510" y="248" fill="#6ee7b7" font-family="Courier New, monospace" font-size="12">class Car { Engine engine; ... }</text>
    <text x="510" y="268" fill="#6ee7b7" font-family="Courier New, monospace" font-size="12">class School { List&lt;Student&gt; students; }</text>

    <text x="495" y="305" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Cardinalities &amp; Forms:</text>
    <text x="495" y="325" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">• 1:1, 1:M, M:N relationships</text>
    <text x="495" y="345" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12">• Subdivided into Aggregation vs Composition</text>

    <rect x="495" y="365" width="345" height="30" rx="4" fill="#064e3b" />
    <text x="667" y="385" text-anchor="middle" fill="#fde047" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">Rule: One class holds member variable of another</text>
  </g>
</svg>
