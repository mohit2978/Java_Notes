<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="758" height="218" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="30" y="80" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Producer</text>
  <text x="105" y="123" text-anchor="middle" font-size="12" fill="#1e3a8a">Thread</text>

  <rect x="305" y="65" width="150" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="380" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">SharedResource</text>
  <text x="380" y="106" text-anchor="middle" font-size="12" fill="#334155">bufferSize = 3</text>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#64748b">shared by both</text>
  <text x="380" y="139" text-anchor="middle" font-size="11" fill="#64748b">threads</text>

  <rect x="580" y="80" width="150" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="655" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Consumer</text>
  <text x="655" y="123" text-anchor="middle" font-size="12" fill="#14532d">Thread</text>

  <path d="M180 95 H300" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="240" y="88" text-anchor="middle" font-size="10.5" fill="#1e3a8a">wait() if full</text>
  <path d="M300 122 H180" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="240" y="138" text-anchor="middle" font-size="10.5" fill="#166534">notify() after produce</text>

  <path d="M455 95 H575" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="515" y="88" text-anchor="middle" font-size="10.5" fill="#166534">notify() after consume</text>
  <path d="M575 122 H455" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <text x="515" y="138" text-anchor="middle" font-size="10.5" fill="#991b1b">wait() if empty</text>

  <text x="380" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">wait() / notify() handoff via the shared monitor lock</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/></marker>
  </defs>
</svg>
