<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="698" height="338" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="175" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">if</text>
  <text x="525" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">while</text>

  <g font-size="12.5">
    <rect x="95" y="45" width="160" height="32" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="175" y="66" text-anchor="middle" fill="#991b1b">if (empty)</text>
    <rect x="95" y="97" width="160" height="32" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="175" y="118" text-anchor="middle" fill="#991b1b">wait()</text>
    <rect x="95" y="149" width="160" height="32" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="175" y="170" text-anchor="middle" fill="#991b1b">Wake up</text>
    <rect x="95" y="201" width="160" height="32" rx="6" fill="#fecaca" stroke="#dc2626"/>
    <text x="175" y="222" text-anchor="middle" fill="#7f1d1d">poll() — no re-check</text>

    <rect x="445" y="45" width="160" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="525" y="66" text-anchor="middle" fill="#1e3a8a">while (empty)</text>
    <rect x="445" y="97" width="160" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="525" y="118" text-anchor="middle" fill="#1e3a8a">wait()</text>
    <rect x="445" y="149" width="160" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="525" y="170" text-anchor="middle" fill="#1e3a8a">Wake up</text>
    <rect x="445" y="201" width="160" height="32" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="525" y="222" text-anchor="middle" fill="#1e3a8a">Check empty again</text>
    <rect x="445" y="253" width="160" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="525" y="274" text-anchor="middle" fill="#1e3a8a">true → wait again</text>
    <rect x="445" y="291" width="160" height="32" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="525" y="312" text-anchor="middle" fill="#1e3a8a">false → poll()</text>
  </g>
  <path d="M175 77 V97 M175 129 V149 M175 181 V201 M525 77 V97 M525 129 V149 M525 181 V201 M525 233 V253" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a4)"/>
