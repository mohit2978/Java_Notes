<svg viewBox="0 0 760 150" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="758" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="11.5">
    <rect x="20" y="55" width="90" height="40" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="65" y="79" text-anchor="middle" fill="#1e3a8a">while(empty)</text>
    <rect x="130" y="55" width="60" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="160" y="79" text-anchor="middle" fill="#14532d">true</text>
    <rect x="210" y="55" width="60" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="240" y="79" text-anchor="middle" fill="#991b1b">wait()</text>
    <rect x="290" y="55" width="90" height="40" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="335" y="72" text-anchor="middle" fill="#991b1b">Thread</text>
    <text x="335" y="86" text-anchor="middle" fill="#991b1b">sleeps</text>
