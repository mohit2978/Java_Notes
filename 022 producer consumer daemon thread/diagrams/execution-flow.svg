<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="638" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-size="12.5">
    <rect x="40" y="20" width="180" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="130" y="42" text-anchor="middle" fill="#1e3a8a">Producer produces 1</text>
    <text x="420" y="42" text-anchor="middle" fill="#334155">Queue: [1]</text>

    <rect x="40" y="70" width="180" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="130" y="92" text-anchor="middle" fill="#1e3a8a">Producer produces 2</text>
    <text x="420" y="92" text-anchor="middle" fill="#334155">Queue: [1, 2]</text>

    <rect x="40" y="120" width="180" height="34" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="130" y="142" text-anchor="middle" fill="#1e3a8a">Producer produces 3</text>
    <text x="420" y="142" text-anchor="middle" fill="#334155">Queue: [1, 2, 3]</text>

    <rect x="40" y="175" width="260" height="55" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="170" y="197" text-anchor="middle" fill="#991b1b">Buffer is full</text>
    <text x="170" y="215" text-anchor="middle" fill="#991b1b">Producer calls wait()</text>
    <text x="420" y="200" text-anchor="middle" fill="#334155">Producer releases lock</text>
    <text x="420" y="216" text-anchor="middle" fill="#334155">Consumer gets lock</text>

    <rect x="40" y="255" width="180" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="130" y="277" text-anchor="middle" fill="#14532d">Consumer removes 1</text>
    <text x="420" y="277" text-anchor="middle" fill="#334155">Queue: [2, 3]</text>

    <rect x="40" y="305" width="220" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="150" y="327" text-anchor="middle" fill="#14532d">Consumer calls notify()</text>
    <text x="420" y="327" text-anchor="middle" fill="#334155">Producer eligible to run again</text>

    <rect x="40" y="355" width="300" height="34" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="190" y="377" text-anchor="middle" fill="#334155">... continue until all 6 items</text>

    <rect x="40" y="395" width="300" height="30" rx="6" fill="#f8fafc" stroke="#64748b"/>
    <text x="190" y="415" text-anchor="middle" fill="#334155">produced and consumed</text>
  </g>
  <path d="M130 54 V70 M130 104 V120 M130 154 V175 M170 230 V255 M130 289 V305 M150 339 V355 M190 389 V395" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
  <defs><marker id="a3" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker></defs>
</svg>
