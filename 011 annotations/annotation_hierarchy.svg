<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #cdd6f4; font-size: 18px; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #a6adc8; }
      .root-box { fill: #313244; stroke: #cba6f7; stroke-width: 2; rx: 10px; }
      .branch-box-1 { fill: #181825; stroke: #89b4fa; stroke-width: 1.5; rx: 8px; }
      .branch-box-2 { fill: #181825; stroke: #f9e2af; stroke-width: 1.5; rx: 8px; }
      .branch-box-3 { fill: #181825; stroke: #a6e3a1; stroke-width: 1.5; rx: 8px; }
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; }
      .item-text { font-family: 'Consolas', 'Fira Code', monospace; font-size: 12px; fill: #cdd6f4; }
      .item-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 11.5px; fill: #a6adc8; }
      .conn-line { stroke: #6c7086; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="940" height="420" rx="14" class="bg"/>

  <text x="30" y="35" class="title">Java Annotations Hierarchy &amp; Classification</text>
  <text x="30" y="55" class="subtitle">Metadata system in Java: Predefined, Meta-Annotations, and Custom user-defined annotations</text>

  <!-- Root: Annotations -->
  <g transform="translate(370, 75)">
    <rect width="200" height="45" class="root-box"/>
    <text x="100" y="28" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#cba6f7">@ Annotations</text>
  </g>

  <!-- Connection Lines -->
  <path d="M 470 120 L 470 145 L 165 145 L 165 170" class="conn-line"/>
  <path d="M 470 145 L 470 170" class="conn-line"/>
  <path d="M 470 145 L 775 145 L 775 170" class="conn-line"/>

  <!-- Branch 1: Predefined (Java Code) -->
  <g transform="translate(30, 170)">
    <rect width="270" height="225" class="branch-box-1"/>
    <text x="15" y="28" class="box-title" fill="#89b4fa">1. Predefined (On Java Code)</text>
    <text x="15" y="45" class="item-desc">Applied to classes, methods, vars</text>
    <line x1="15" y1="55" x2="255" y2="55" stroke="#313244" stroke-width="1"/>

    <text x="15" y="80" class="item-text" fill="#89dceb">@Override</text>
    <text x="15" y="96" class="item-desc">Compile-time override validation</text>

    <text x="15" y="120" class="item-text" fill="#89dceb">@Deprecated</text>
    <text x="15" y="136" class="item-desc">Warns against using obsolete API</text>

    <text x="15" y="160" class="item-text" fill="#89dceb">@SuppressWarnings</text>
    <text x="15" y="176" class="item-desc">Mutes compiler warnings</text>

    <text x="15" y="200" class="item-text" fill="#89dceb">@SafeVarargs, @FunctionalInterface</text>
  </g>

  <!-- Branch 2: Meta-Annotations -->
  <g transform="translate(335, 170)">
    <rect width="270" height="225" class="branch-box-2"/>
    <text x="15" y="28" class="box-title" fill="#f9e2af">2. Meta-Annotations</text>
    <text x="15" y="45" class="item-desc">Applied OVER other annotations</text>
    <line x1="15" y1="55" x2="255" y2="55" stroke="#313244" stroke-width="1"/>

    <text x="15" y="80" class="item-text" fill="#fab387">@Target</text>
    <text x="15" y="96" class="item-desc">Restricts where annotation can apply</text>

    <text x="15" y="120" class="item-text" fill="#fab387">@Retention</text>
    <text x="15" y="136" class="item-desc">Defines lifecycle (SOURCE, CLASS, RUNTIME)</text>

    <text x="15" y="160" class="item-text" fill="#fab387">@Documented, @Inherited</text>
    <text x="15" y="176" class="item-desc">Javadoc inclusion &amp; subclass inheritance</text>

    <text x="15" y="200" class="item-text" fill="#fab387">@Repeatable (Java 8+)</text>
  </g>

  <!-- Branch 3: Custom Annotations -->
  <g transform="translate(640, 170)">
    <rect width="270" height="225" class="branch-box-3"/>
    <text x="15" y="28" class="box-title" fill="#a6e3a1">3. Custom / User Defined</text>
    <text x="15" y="45" class="item-desc">Created via @interface keyword</text>
    <line x1="15" y1="55" x2="255" y2="55" stroke="#313244" stroke-width="1"/>

    <text x="15" y="80" class="item-text" fill="#a6e3a1">Marker Annotations</text>
    <text x="15" y="96" class="item-desc">Empty body (e.g. public @interface Test{})</text>

    <text x="15" y="120" class="item-text" fill="#a6e3a1">Single-Value (@interface)</text>
    <text x="15" y="136" class="item-desc">Has String value() member</text>

    <text x="15" y="160" class="item-text" fill="#a6e3a1">Multi-Value with defaults</text>
    <text x="15" y="176" class="item-desc">String name() default "defaultVal";</text>

    <text x="15" y="200" class="item-text" fill="#a6e3a1">Read via Reflection at runtime</text>
  </g>
</svg>
