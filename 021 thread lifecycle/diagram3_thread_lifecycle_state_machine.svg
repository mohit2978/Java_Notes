<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; fill: #cdd6f4; font-size: 20px; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #a6adc8; }
      .card { fill: #181825; stroke: #313244; stroke-width: 1.5; rx: 12px; }
      .state-new { fill: #263347; stroke: #89b4fa; stroke-width: 2; rx: 10px; }
      .state-runnable { fill: #2d3843; stroke: #a6e3a1; stroke-width: 2.5; rx: 10px; }
      .state-blocked { fill: #452b36; stroke: #f38ba8; stroke-width: 2; rx: 10px; }
      .state-waiting { fill: #3d352a; stroke: #fab387; stroke-width: 2; rx: 10px; }
      .state-timed { fill: #383145; stroke: #cba6f7; stroke-width: 2; rx: 10px; }
      .state-term { fill: #313244; stroke: #6c7086; stroke-width: 2; rx: 10px; }
      .state-title { font-family: 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; text-anchor: middle; }
      .state-sub { font-family: 'Segoe UI', sans-serif; font-size: 11px; fill: #a6adc8; text-anchor: middle; }
      .mono-txt { font-family: 'Consolas', 'Fira Code', monospace; font-size: 10.5px; fill: #cdd6f4; }
      .label-txt { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #fab387; font-weight: 600; text-anchor: middle; }
      .label-grn { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #a6e3a1; font-weight: 600; text-anchor: middle; }
      .label-blu { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #89b4fa; font-weight: 600; text-anchor: middle; }
      .label-red { font-family: 'Segoe UI', sans-serif; font-size: 10.5px; fill: #f38ba8; font-weight: 600; text-anchor: middle; }
      .arrow-o { stroke: #fab387; stroke-width: 2; fill: none; marker-end: url(#arr-o); }
      .arrow-g { stroke: #a6e3a1; stroke-width: 2; fill: none; marker-end: url(#arr-g); }
      .arrow-b { stroke: #89b4fa; stroke-width: 2; fill: none; marker-end: url(#arr-b); }
      .arrow-r { stroke: #f38ba8; stroke-width: 2; fill: none; marker-end: url(#arr-r); }
      .arrow-p { stroke: #cba6f7; stroke-width: 2; fill: none; marker-end: url(#arr-p); }
      .arrow-gray { stroke: #6c7086; stroke-width: 2; fill: none; marker-end: url(#arr-gray); }
    </style>
    <marker id="arr-o" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#fab387" />
    </marker>
    <marker id="arr-g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#a6e3a1" />
    </marker>
    <marker id="arr-b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#89b4fa" />
    </marker>
    <marker id="arr-r" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#f38ba8" />
    </marker>
    <marker id="arr-p" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#cba6f7" />
    </marker>
    <marker id="arr-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#6c7086" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" rx="14" class="bg"/>

  <!-- Header -->
  <text x="35" y="38" class="title">Java Thread Lifecycle State Machine (java.lang.Thread.State)</text>
  <text x="35" y="58" class="subtitle">State transitions, method triggers, lock behaviors, and lifecycle boundaries</text>

  <!-- 1. NEW STATE -->
  <g transform="translate(35, 105)">
    <rect width="160" height="90" class="state-new"/>
    <text x="80" y="32" class="state-title" fill="#89b4fa">1. NEW</text>
    <text x="80" y="52" class="state-sub">Thread instance created</text>
    <text x="80" y="70" class="mono-txt" text-anchor="middle">new Thread(task);</text>
  </g>

  <!-- Arrow NEW -> RUNNABLE -->
  <line x1="195" y1="150" x2="285" y2="150" class="arrow-b"/>
  <text x="240" y="140" class="label-blu">start()</text>

  <!-- 2. RUNNABLE STATE (Ready & Running) -->
  <g transform="translate(295, 80)">
    <rect width="410" height="140" class="state-runnable"/>
    <text x="205" y="28" class="state-title" fill="#a6e3a1">2. RUNNABLE (Actively Running or Ready)</text>
    
    <!-- Sub-state: Ready -->
    <g transform="translate(20, 42)">
      <rect width="170" height="75" fill="#181825" stroke="#89b4fa" rx="6"/>
      <text x="85" y="24" class="state-title" font-size="13" fill="#89b4fa">Ready to Run</text>
      <text x="85" y="42" class="state-sub">Waiting for OS CPU</text>
      <text x="85" y="60" class="state-sub">scheduler time slice</text>
    </g>

    <!-- Sub-state: Running -->
    <g transform="translate(220, 42)">
      <rect width="170" height="75" fill="#181825" stroke="#a6e3a1" rx="6"/>
      <text x="85" y="24" class="state-title" font-size="13" fill="#a6e3a1">Running on CPU</text>
      <text x="85" y="42" class="state-sub">Executing bytecode</text>
      <text x="85" y="60" class="state-sub">in CPU registers</text>
    </g>

    <!-- Internal transition between Ready and Running -->
    <line x1="192" y1="70" x2="218" y2="70" class="arrow-g"/>
    <line x1="218" y1="95" x2="192" y2="95" class="arrow-b"/>
  </g>

  <!-- Arrow RUNNABLE -> TERMINATED -->
  <line x1="705" y1="150" x2="795" y2="150" class="arrow-gray"/>
  <text x="750" y="140" class="label-txt" fill="#6c7086">run() finishes</text>

  <!-- 6. TERMINATED STATE -->
  <g transform="translate(805, 105)">
    <rect width="160" height="90" class="state-term"/>
    <text x="80" y="32" class="state-title" fill="#a6adc8">6. TERMINATED</text>
    <text x="80" y="52" class="state-sub">Execution complete</text>
    <text x="80" y="70" class="mono-txt" fill="#f38ba8" text-anchor="middle">&#10006; Cannot Restart!</text>
  </g>

  <!-- Transitions to Non-Runnable States (Downwards) -->

  <!-- 3. BLOCKED STATE -->
  <g transform="translate(35, 300)">
    <rect width="280" height="130" class="state-blocked"/>
    <text x="140" y="28" class="state-title" fill="#f38ba8">3. BLOCKED</text>
    <text x="140" y="48" class="state-sub">Waiting to acquire Monitor Lock</text>
    <line x1="15" y1="56" x2="265" y2="56" stroke="#313244"/>
    <text x="15" y="75" class="mono-txt" fill="#f38ba8">&#8226; Trigger: synchronized(lock)</text>
    <text x="15" y="93" class="mono-txt">&#8226; Held by: Another Thread</text>
    <text x="15" y="112" class="label-grn" font-size="11">&#8226; Exit: Lock acquired &#8594; RUNNABLE</text>
  </g>

  <!-- Arrows between RUNNABLE and BLOCKED -->
  <path d="M 360 220 C 360 260, 240 260, 240 300" class="arrow-r"/>
  <text x="310" y="255" class="label-red">Wait for lock</text>

  <path d="M 210 300 C 210 245, 320 245, 320 220" class="arrow-g"/>
  <text x="215" y="250" class="label-grn">Lock acquired</text>

  <!-- 4. WAITING STATE -->
  <g transform="translate(360, 300)">
    <rect width="280" height="130" class="state-waiting"/>
    <text x="140" y="28" class="state-title" fill="#fab387">4. WAITING (Indefinite)</text>
    <text x="140" y="48" class="state-sub">Waiting for another thread's action</text>
    <line x1="15" y1="56" x2="265" y2="56" stroke="#313244"/>
    <text x="15" y="75" class="mono-txt">&#8226; object.wait() <tspan fill="#a6e3a1">[RELEASES LOCK]</tspan></text>
    <text x="15" y="93" class="mono-txt">&#8226; thread.join() | park()</text>
    <text x="15" y="112" class="label-grn" font-size="11">&#8226; Exit: notify() / notifyAll()</text>
  </g>

  <!-- Arrows between RUNNABLE and WAITING -->
  <path d="M 480 220 L 480 300" class="arrow-o"/>
  <text x="450" y="260" class="label-txt">wait() / join()</text>

  <path d="M 520 300 L 520 220" class="arrow-g"/>
  <text x="560" y="260" class="label-grn">notifyAll()</text>

  <!-- 5. TIMED_WAITING STATE -->
  <g transform="translate(685, 300)">
    <rect width="280" height="130" class="state-timed"/>
    <text x="140" y="28" class="state-title" fill="#cba6f7">5. TIMED_WAITING</text>
    <text x="140" y="48" class="state-sub">Waiting for specified timeout</text>
    <line x1="15" y1="56" x2="265" y2="56" stroke="#313244"/>
    <text x="15" y="75" class="mono-txt">&#8226; Thread.sleep(ms) <tspan fill="#f38ba8">[HOLDS LOCK]</tspan></text>
    <text x="15" y="93" class="mono-txt">&#8226; object.wait(ms) | join(ms)</text>
    <text x="15" y="112" class="label-grn" font-size="11">&#8226; Exit: Timeout expires or notify</text>
  </g>

  <!-- Arrows between RUNNABLE and TIMED_WAITING -->
  <path d="M 640 220 C 640 260, 750 260, 750 300" class="arrow-p"/>
  <text x="730" y="255" class="label-txt" fill="#cba6f7">sleep(ms)</text>

  <path d="M 780 300 C 780 245, 675 245, 675 220" class="arrow-g"/>
  <text x="810" y="250" class="label-grn">Timer expires</text>

  <!-- Bottom: Monitor Lock Behavior Summary Banner -->
  <g transform="translate(35, 460)">
    <rect width="930" height="150" class="card"/>
    <text x="25" y="30" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" fill="#f9e2af">&#128273; Critical Monitor Lock Rules Across Lifecycle States</text>
    <line x1="25" y1="42" x2="905" y2="42" stroke="#313244"/>

    <g transform="translate(25, 55)">
      <rect width="425" height="75" fill="#1e1e2e" stroke="#a6e3a1" rx="6"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12.5" fill="#a6e3a1">&#10004; Releases Monitor Lock: wait()</text>
      <text x="15" y="44" class="body-txt">When a thread calls <tspan class="mono-txt">lock.wait()</tspan>, it <tspan fill="#a6e3a1" font-weight="700">releases the lock</tspan> immediately,</text>
      <text x="15" y="60" class="body-txt">allowing producer threads to enter the synchronized block.</text>
    </g>

    <g transform="translate(480, 55)">
      <rect width="425" height="75" fill="#1e1e2e" stroke="#f38ba8" rx="6"/>
      <text x="15" y="24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12.5" fill="#f38ba8">&#9888; Retains (DOES NOT Release) Lock: sleep()</text>
      <text x="15" y="44" class="body-txt">When a thread calls <tspan class="mono-txt">Thread.sleep(ms)</tspan>, it <tspan fill="#f38ba8" font-weight="700">retains all locks</tspan>.</text>
      <text x="15" y="60" class="body-txt">Other competing threads remain <tspan fill="#f38ba8">BLOCKED</tspan> until it wakes and exits.</text>
    </g>
  </g>
</svg>
