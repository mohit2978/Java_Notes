<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="698" height="298" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Concurrency can be achieved using</text>

  <rect x="60" y="50" width="220" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Lock-based Mechanism</text>

  <rect x="420" y="50" width="220" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Lock-Free Mechanism</text>

  <path d="M350 36 L170 50" stroke="#64748b" stroke-width="1.5" marker-end="url(#l1)"/>
  <path d="M350 36 L530 50" stroke="#64748b" stroke-width="1.5" marker-end="url(#l1)"/>

  <g font-size="11.5" fill="#7f1d1d">
    <text x="70" y="108">— Synchronized</text>
    <text x="70" y="130">— Reentrant Lock</text>
    <text x="70" y="152">— Stamped Lock</text>
    <text x="70" y="174">— ReadWrite Lock</text>
    <text x="70" y="196">— Semaphores</text>
  </g>
  <text x="170" y="215" text-anchor="middle" font-size="10.5" fill="#991b1b">(these "lock free" alternatives still use locks internally)</text>
  <path d="M170 84 V96" stroke="#dc2626" stroke-width="1.5"/>

  <rect x="440" y="96" width="180" height="28" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="115" text-anchor="middle" font-size="11.5" fill="#14532d">CAS Operation</text>
  <path d="M530 84 V96" stroke="#16a34a" stroke-width="1.5"/>

  <g font-size="11.5" fill="#14532d">
    <text x="450" y="150">— AtomicInteger</text>
    <text x="450" y="172">— AtomicBoolean</text>
    <text x="450" y="194">— AtomicLong</text>
    <text x="450" y="216">— AtomicReference</text>
  </g>
  <path d="M530 124 V138" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Faster — no OS-level locks (used in read-modify-update)</text>

  <text x="350" y="280" text-anchor="middle" font-size="11.5" fill="#334155">Net alternative of the lock-based mechanism</text>

  <defs><marker id="l1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker></defs>
</svg>
