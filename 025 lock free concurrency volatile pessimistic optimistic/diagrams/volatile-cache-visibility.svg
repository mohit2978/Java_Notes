<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect x="1" y="1" width="618" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="150" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Thread T1</text>
  <rect x="60" y="36" width="180" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="61" text-anchor="middle" font-size="13" fill="#1e3a8a">n++</text>

  <text x="470" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Thread T2</text>
  <rect x="380" y="36" width="180" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="61" text-anchor="middle" font-size="13" fill="#14532d">n++</text>

  <text x="150" y="94" text-anchor="middle" font-size="10.5" fill="#64748b">CPU Core 1</text>
  <text x="470" y="94" text-anchor="middle" font-size="10.5" fill="#64748b">CPU Core 2</text>
  <path d="M150 76 V102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#v1)"/>
  <path d="M470 76 V102" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#v1)"/>

  <rect x="60" y="102" width="180" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#991b1b">L1 Cache</text>
  <text x="150" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">n = 11</text>

  <rect x="380" y="102" width="180" height="46" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="122" text-anchor="middle" font-size="12" fill="#334155">L1 Cache</text>
  <text x="470" y="140" text-anchor="middle" font-size="11" fill="#64748b">(no local copy)</text>

  <path d="M150 148 V172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#v2)"/>
  <path d="M470 148 V172" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#v2)"/>

  <rect x="60" y="172" width="500" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">L2 Cache (shared)</text>

  <path d="M310 218 V242" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#v3)"/>

  <rect x="60" y="242" width="500" height="46" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="230" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">Memory</text>
  <text x="400" y="270" text-anchor="middle" font-size="12.5" fill="#334155">n = 10</text>

  <text x="310" y="315" text-anchor="middle" font-size="11.5" fill="#991b1b">T1 updates n to 11 in its own L1 cache.</text>
  <text x="310" y="333" text-anchor="middle" font-size="11.5" fill="#334155">T2 sees no value in its L1 cache, none in L2 either → reads stale n = 10 from Memory.</text>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#334155">L1 cache is only periodically synced with Memory — until then, T1's write is invisible to T2.</text>
  <text x="310" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">volatile forces every read/write to go straight to Memory, skipping the cache.</text>

  <defs>
    <marker id="v1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker>
    <marker id="v2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker>
    <marker id="v3" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
